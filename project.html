    <script src="app.js"></script>
    <script>const i = +new URLSearchParams(location.search).get('id'); const p = projects[i] || projects[0]; const gallery = [1, 2, 3].map(offset => projects[(i + offset) % projects.length]); document.title = p[1] + ' | Fereshteh Azizi'; document.querySelector('#project-detail').innerHTML = `<div class="project-visuals"><img class="project-hero-image" src="projects/${p[0]}" alt="${p[1]}"><div class="gallery-label">Project gallery <span>01 — 04</span></div><div class="project-gallery">${gallery.map((image, index) => `<figure><img src="projects/${image[0]}" alt="${p[1]} supporting visual ${index + 1}" loading="lazy"><figcaption>Detail 0${index + 2}</figcaption></figure>`).join('')}</div></div><div class="project-copy"><p class="eyebrow">${p[2]}</p><h1>${p[1]}</h1><p class="intro">${p[3]}</p><dl><div><dt>Category</dt><dd>${p[2]}</dd></div><div><dt>Role</dt><dd>Designer</dd></div><div><dt>Focus</dt><dd>Visual storytelling</dd></div><div><dt>Year</dt><dd>2025</dd></div></dl><h2>The idea</h2><p>${p[3]} This work reflects my interest in combining thoughtful details with a clear, approachable experience.</p></div>`</script>
